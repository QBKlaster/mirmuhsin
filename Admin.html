<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<base target="_top">
<style>
:root{--ink:#06202A;--teal:#0B4C5C;--gold:#C8A44C;--paper:#EDF1F1;--line:#D3DEDE;--txt:#123038;--soft:#5B7580}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--txt);font:15px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--ink);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header b{font-size:1.05rem}
header .who{margin-left:auto;color:#9FBDC2;font-size:.85rem}
nav{display:flex;gap:2px;background:var(--ink);padding:0 16px;flex-wrap:wrap}
nav button{background:none;border:0;color:#C6D8DB;padding:11px 15px;cursor:pointer;font:inherit;font-size:.92rem;
  border-bottom:2px solid transparent}
nav button.on{color:#E6D09A;border-bottom-color:var(--gold)}
main{padding:26px 22px 70px;max-width:1060px;margin:0 auto}
h2{font-size:1.25rem;margin:0 0 14px}
.tab{display:none}.tab.on{display:block}
.card{background:#fff;border:1px solid var(--line);padding:18px;margin-bottom:14px;border-radius:3px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{display:block;font-size:.82rem;font-weight:600;margin-bottom:5px}
input,textarea,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:3px;font:inherit;background:#fff}
textarea{min-height:90px;resize:vertical}
.full{grid-column:1/-1}
button.go{background:var(--teal);color:#fff;border:0;padding:10px 18px;border-radius:3px;cursor:pointer;font:inherit;font-weight:600}
button.go.gold{background:var(--gold);color:var(--ink)}
button.go.ghost{background:none;color:var(--teal);border:1px solid var(--line)}
button.go.danger{background:#A33827}
button.go:disabled{opacity:.5;cursor:default}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.item{display:flex;gap:14px;align-items:flex-start;border-bottom:1px solid var(--line);padding:13px 0}
.item:last-child{border-bottom:0}
.item .g{flex:1;min-width:0}
.item h3{margin:0 0 3px;font-size:1rem}
.item small{color:var(--soft);font-size:.82rem}
.pill{font-size:.72rem;padding:2px 8px;border-radius:20px;background:#E5EFEF;color:var(--soft)}
.pill.live{background:#DEF0E2;color:#1F6B36}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--soft);font-weight:600;font-size:.78rem}
.msg{padding:10px 14px;border-left:3px solid var(--gold);background:#FBF3DF;margin-bottom:14px;display:none}
.msg.on{display:block}
.msg.bad{border-color:#A33827;background:#F7E4E0}
.muted{color:var(--soft);font-size:.88rem}
@media(max-width:700px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
  <b>Model of OTS — admin</b>
  <span class="who" id="who"></span>
</header>

<nav>
  <button data-tab="events" class="on">Tadbirlar</button>
  <button data-tab="news">Yangiliklar</button>
  <button data-tab="settings">Umumiy ma'lumot</button>
  <button data-tab="apps">Arizalar</button>
</nav>

<main>
  <div class="msg" id="msg"></div>

  <!-- ============ TADBIRLAR ============ -->
  <section class="tab on" id="tab-events">
    <h2>Tadbir qo'shish</h2>
    <div class="card">
      <input type="hidden" id="e-id">
      <div class="row">
        <div><label>Nomi (o'zbekcha)</label><input id="e-titleUz"></div>
        <div><label>Nomi (inglizcha)</label><input id="e-titleEn"></div>
        <div><label>Boshlanish vaqti</label><input id="e-startsAt" type="datetime-local"></div>
        <div><label>Tugash vaqti (ixtiyoriy)</label><input id="e-endsAt" type="datetime-local"></div>
        <div><label>Manzil</label><input id="e-location" placeholder="Qarshi, ..."></div>
        <div><label>Havola (ixtiyoriy)</label><input id="e-link" placeholder="#/register"></div>
        <div class="full"><label>Tavsif (o'zbekcha)</label><textarea id="e-descUz"></textarea></div>
        <div class="full"><label>Tavsif (inglizcha)</label><textarea id="e-descEn"></textarea></div>
        <div class="full"><label><input type="checkbox" id="e-published" checked style="width:auto"> Saytda ko'rinsin</label></div>
      </div>
      <div class="actions">
        <button class="go" id="e-save">Saqlash</button>
        <button class="go ghost" id="e-reset">Bekor qilish</button>
      </div>
    </div>

    <h2>Tadbirlar ro'yxati</h2>
    <div class="card" id="e-list"><p class="muted">Yuklanmoqda…</p></div>
  </section>

  <!-- ============ YANGILIKLAR ============ -->
  <section class="tab" id="tab-news">
    <h2>Yangilik qo'shish</h2>
    <div class="card">
      <input type="hidden" id="n-id">
      <div class="row">
        <div><label>Sana</label><input id="n-date" type="date"></div>
        <div><label>Rasm havolasi (ixtiyoriy)</label><input id="n-image" placeholder="https://..."></div>
        <div><label>Sarlavha (o'zbekcha)</label><input id="n-titleUz"></div>
        <div><label>Sarlavha (inglizcha)</label><input id="n-titleEn"></div>
        <div class="full"><label>Matn (o'zbekcha)</label><textarea id="n-bodyUz"></textarea></div>
        <div class="full"><label>Matn (inglizcha)</label><textarea id="n-bodyEn"></textarea></div>
        <div class="full"><label><input type="checkbox" id="n-published" checked style="width:auto"> Saytda ko'rinsin</label></div>
      </div>
      <div class="actions">
        <button class="go" id="n-save">Saqlash</button>
        <button class="go ghost" id="n-reset">Bekor qilish</button>
      </div>
    </div>

    <h2>Yangiliklar ro'yxati</h2>
    <div class="card" id="n-list"><p class="muted">Yuklanmoqda…</p></div>
  </section>

  <!-- ============ SOZLAMALAR ============ -->
  <section class="tab" id="tab-settings">
    <h2>Saytdagi umumiy ma'lumotlar</h2>
    <div class="card">
      <div class="row" id="s-fields"></div>
      <div class="actions"><button class="go" id="s-save">Saqlash</button></div>
      <p class="muted" style="margin-top:12px">Bo'sh qoldirilgan maydon o'rniga saytdagi asl matn ko'rinadi.</p>
    </div>
  </section>

  <!-- ============ ARIZALAR ============ -->
  <section class="tab" id="tab-apps">
    <h2>Arizalar</h2>
    <div class="card">
      <div class="actions" style="margin:0 0 14px">
        <button class="go gold" id="a-accept">Qabul qilinganlarga xat yuborish</button>
        <button class="go ghost" id="a-reject">Rad etilganlarga xat yuborish</button>
        <a id="a-sheet" href="#" target="_blank"><button class="go ghost">Jadvalni ochish (Excel)</button></a>
      </div>
      <div id="a-list"><p class="muted">Yuklanmoqda…</p></div>
    </div>
  </section>
</main>

<script>
var DATA = { events:[], news:[], settings:{}, settingKeys:[], applications:[] };
var LABELS = {
  email:"Pochta", phone:"Murojaat uchun telefon", telegram:"Telegram (murojaat) havolasi", channel:"Telegram kanal havolasi",
  cityEn:"Shahar (inglizcha)", cityUz:"Shahar (o'zbekcha)",
  heroSubEn:"Bosh sahifa matni (inglizcha)", heroSubUz:"Bosh sahifa matni (o'zbekcha)",
  delegationsEn:"Delegatsiyalar (inglizcha)", delegationsUz:"Delegatsiyalar (o'zbekcha)"
};

function $(id){ return document.getElementById(id); }
function say(text, bad){
  var m=$('msg'); m.textContent=text; m.className='msg on'+(bad?' bad':'');
  clearTimeout(say.t); say.t=setTimeout(function(){ m.className='msg'; }, 5000);
}
function esc(v){ return String(v==null?'':v).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function busy(on){ document.querySelectorAll('button.go').forEach(function(b){ b.disabled=on; }); }

/* ---------- tabs ---------- */
document.querySelectorAll('nav button').forEach(function(b){
  b.addEventListener('click', function(){
    document.querySelectorAll('nav button').forEach(function(x){ x.classList.remove('on'); });
    document.querySelectorAll('.tab').forEach(function(x){ x.classList.remove('on'); });
    b.classList.add('on'); $('tab-'+b.dataset.tab).classList.add('on');
  });
});

/* ---------- load ---------- */
function boot(){
  google.script.run.withSuccessHandler(function(d){
    DATA = d;
    $('who').textContent = d.email;
    $('a-sheet').href = d.sheetUrl;
    renderEvents(); renderNews(); renderSettings(); renderApps();
  }).withFailureHandler(function(e){ say(e.message || 'Xatolik', true); }).adminLoad();
}
boot();

/* ---------- events ---------- */
function renderEvents(){
  var list = DATA.events.slice().sort(function(a,b){ return String(a.startsAt).localeCompare(String(b.startsAt)); });
  if(!list.length){ $('e-list').innerHTML = '<p class="muted">Hali tadbir yo\'q.</p>'; return; }
  $('e-list').innerHTML = list.map(function(e){
    var live = e.published==='TRUE';
    return '<div class="item"><div class="g">'+
      '<h3>'+esc(e.titleUz||e.titleEn)+' <span class="pill'+(live?' live':'')+'">'+(live?'saytda':'yashirin')+'</span></h3>'+
      '<small>'+esc(e.startsAt||'vaqt belgilanmagan')+(e.location?' — '+esc(e.location):'')+'</small>'+
      '</div><div class="actions" style="margin:0">'+
      '<button class="go ghost" onclick="editEvent(\''+e.id+'\')">Tahrirlash</button>'+
      '<button class="go danger" onclick="delEvent(\''+e.id+'\')">O\'chirish</button>'+
      '</div></div>';
  }).join('');
}
function editEvent(id){
  var e = DATA.events.filter(function(x){ return x.id===id; })[0]; if(!e) return;
  ['id','titleUz','titleEn','startsAt','endsAt','location','link','descUz','descEn'].forEach(function(k){
    $('e-'+k).value = e[k]||'';
  });
  $('e-published').checked = e.published==='TRUE';
  window.scrollTo({top:0,behavior:'smooth'});
}
function delEvent(id){
  if(!confirm('Tadbir o\'chirilsinmi?')) return;
  busy(true);
  google.script.run.withSuccessHandler(function(list){
    DATA.events=list; renderEvents(); busy(false); say('O\'chirildi.');
  }).withFailureHandler(function(e){ busy(false); say(e.message,true); }).adminDeleteEvent(id);
}
$('e-save').addEventListener('click', function(){
  var o = { id:$('e-id').value, published:$('e-published').checked };
  ['titleUz','titleEn','startsAt','endsAt','location','link','descUz','descEn'].forEach(function(k){ o[k]=$('e-'+k).value; });
  if(!o.titleUz && !o.titleEn){ say('Tadbir nomini yozing.',true); return; }
  if(!o.startsAt){ say('Boshlanish vaqtini belgilang.',true); return; }
  busy(true);
  google.script.run.withSuccessHandler(function(list){
    DATA.events=list; renderEvents(); resetEvent(); busy(false); say('Saqlandi. Sayt 1 daqiqada yangilanadi.');
  }).withFailureHandler(function(e){ busy(false); say(e.message,true); }).adminSaveEvent(o);
});
function resetEvent(){
  ['id','titleUz','titleEn','startsAt','endsAt','location','link','descUz','descEn'].forEach(function(k){ $('e-'+k).value=''; });
  $('e-published').checked = true;
}
$('e-reset').addEventListener('click', resetEvent);

/* ---------- news ---------- */
function renderNews(){
  var list = DATA.news.slice().sort(function(a,b){ return String(b.date).localeCompare(String(a.date)); });
  if(!list.length){ $('n-list').innerHTML = '<p class="muted">Hali yangilik yo\'q.</p>'; return; }
  $('n-list').innerHTML = list.map(function(n){
    var live = n.published==='TRUE';
    return '<div class="item"><div class="g">'+
      '<h3>'+esc(n.titleUz||n.titleEn)+' <span class="pill'+(live?' live':'')+'">'+(live?'saytda':'yashirin')+'</span></h3>'+
      '<small>'+esc(n.date)+'</small></div>'+
      '<div class="actions" style="margin:0">'+
      '<button class="go ghost" onclick="editNews(\''+n.id+'\')">Tahrirlash</button>'+
      '<button class="go danger" onclick="delNews(\''+n.id+'\')">O\'chirish</button>'+
      '</div></div>';
  }).join('');
}
function editNews(id){
  var n = DATA.news.filter(function(x){ return x.id===id; })[0]; if(!n) return;
  ['id','date','image','titleUz','titleEn','bodyUz','bodyEn'].forEach(function(k){ $('n-'+k).value=n[k]||''; });
  $('n-published').checked = n.published==='TRUE';
  window.scrollTo({top:0,behavior:'smooth'});
}
function delNews(id){
  if(!confirm('Yangilik o\'chirilsinmi?')) return;
  busy(true);
  google.script.run.withSuccessHandler(function(list){
    DATA.news=list; renderNews(); busy(false); say('O\'chirildi.');
  }).withFailureHandler(function(e){ busy(false); say(e.message,true); }).adminDeleteNews(id);
}
$('n-save').addEventListener('click', function(){
  var o = { id:$('n-id').value, published:$('n-published').checked };
  ['date','image','titleUz','titleEn','bodyUz','bodyEn'].forEach(function(k){ o[k]=$('n-'+k).value; });
  if(!o.titleUz && !o.titleEn){ say('Sarlavhani yozing.',true); return; }
  if(!o.date){ o.date = new Date().toISOString().slice(0,10); }
  busy(true);
  google.script.run.withSuccessHandler(function(list){
    DATA.news=list; renderNews(); resetNews(); busy(false); say('Saqlandi. Sayt 1 daqiqada yangilanadi.');
  }).withFailureHandler(function(e){ busy(false); say(e.message,true); }).adminSaveNews(o);
});
function resetNews(){
  ['id','date','image','titleUz','titleEn','bodyUz','bodyEn'].forEach(function(k){ $('n-'+k).value=''; });
  $('n-published').checked = true;
}
$('n-reset').addEventListener('click', resetNews);

/* ---------- settings ---------- */
function renderSettings(){
  $('s-fields').innerHTML = DATA.settingKeys.map(function(k){
    var big = k.indexOf('heroSub')===0;
    var label = LABELS[k] || k;
    var val = esc(DATA.settings[k]||'');
    return '<div'+(big?' class="full"':'')+'><label>'+esc(label)+'</label>'+
      (big ? '<textarea id="s-'+k+'">'+val+'</textarea>' : '<input id="s-'+k+'" value="'+val+'">')+'</div>';
  }).join('');
}
$('s-save').addEventListener('click', function(){
  var o = {};
  DATA.settingKeys.forEach(function(k){ o[k] = $('s-'+k).value; });
  busy(true);
  google.script.run.withSuccessHandler(function(st){
    DATA.settings=st; busy(false); say('Saqlandi. Sayt 1 daqiqada yangilanadi.');
  }).withFailureHandler(function(e){ busy(false); say(e.message,true); }).adminSaveSettings(o);
});

/* ---------- applications ---------- */
function renderApps(){
  var list = DATA.applications;
  if(!list.length){ $('a-list').innerHTML='<p class="muted">Hali ariza yo\'q.</p>'; return; }
  $('a-list').innerHTML =
    '<table><tr><th>Sana</th><th>Ism</th><th>Davlat</th><th>Lavozim</th><th>Aloqa</th><th>Holat</th><th>Xat</th></tr>'+
    list.map(function(a){
      return '<tr><td>'+esc(a.when)+'</td><td>'+esc(a.name)+'<br><small>'+esc(a.institution)+'</small></td>'+
        '<td>'+esc(a.country)+'</td><td>'+esc(a.position)+'</td>'+
        '<td>'+esc(a.email)+'<br><small>'+esc(a.phone)+'</small></td>'+
        '<td><select onchange="setStatus('+a.row+',this.value)">'+
          ['New','Accepted','Rejected'].map(function(s){
            return '<option'+(a.status===s?' selected':'')+'>'+s+'</option>'; }).join('')+
        '</select></td><td>'+esc(a.mailed)+'</td></tr>';
    }).join('')+'</table>';
}
function setStatus(row, status){
  busy(true);
  google.script.run.withSuccessHandler(function(list){
    DATA.applications=list; renderApps(); busy(false); say('Holat yangilandi.');
  }).withFailureHandler(function(e){ busy(false); say(e.message,true); }).adminSetStatus(row, status);
}
function send(kind, text){
  if(!confirm(text)) return;
  busy(true);
  google.script.run.withSuccessHandler(function(r){
    DATA.applications=r.list; renderApps(); busy(false); say(r.sent+' ta xat yuborildi.');
  }).withFailureHandler(function(e){ busy(false); say(e.message,true); }).adminSendEmails(kind);
}
$('a-accept').addEventListener('click', function(){ send('accept','Qabul qilinganlarga xat yuborilsinmi?'); });
$('a-reject').addEventListener('click', function(){ send('reject','Rad etilganlarga xat yuborilsinmi?'); });
</script>
</body>
</html>
